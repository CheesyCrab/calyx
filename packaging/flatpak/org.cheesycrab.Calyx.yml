id: org.cheesycrab.Calyx
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: org.cheesycrab.Calyx
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --device-if=all:!has-input-device
  - --device=input
modules:
  - name: calyx
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      cflags: -std=gnu99 -ffile-prefix-map=/run/build/calyx=/calyx-source
      env:
        CARGO_HOME: /run/build/calyx/cargo
        CARGO_NET_OFFLINE: 'true'
        CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        RUSTFLAGS: --remap-path-prefix=/run/build/calyx=/calyx-source
        SDL2_TOOLCHAIN: /run/build/calyx/flatpak/sdl2-flatpak-toolchain.cmake
    build-commands:
      - cargo --offline build --release -p calyx-cli --no-default-features --features sdl-bundled
      - install -Dm755 target/release/calyx /app/lib/calyx/calyx
      - cp -a staged/product/. /app/lib/calyx/
      - install -Dm755 flatpak/org.cheesycrab.Calyx /app/bin/org.cheesycrab.Calyx
      - install -Dm644 staged/integration/org.cheesycrab.Calyx.desktop /app/share/applications/org.cheesycrab.Calyx.desktop
      - install -Dm644 staged/integration/org.cheesycrab.Calyx.metainfo.xml /app/share/metainfo/org.cheesycrab.Calyx.metainfo.xml
      - install -Dm644 staged/integration/org.cheesycrab.Calyx.svg /app/share/icons/hicolor/scalable/apps/org.cheesycrab.Calyx.svg
      - desktop-file-validate /app/share/applications/org.cheesycrab.Calyx.desktop
      - sh flatpak/validate-metainfo.sh /app/share/metainfo/org.cheesycrab.Calyx.metainfo.xml
    sources:
      - cargo-sources.json
      - type: file
        path: ../../Cargo.toml
      - type: file
        path: ../../Cargo.lock
      - type: dir
        path: ../../crates
        dest: crates
      - type: dir
        path: ../../assets/fonts
        dest: assets/fonts
      - type: dir
        path: ../../build/flatpak/input/product
        dest: staged/product
      - type: dir
        path: ../../build/flatpak/input/integration
        dest: staged/integration
      - type: dir
        path: .
        dest: flatpak
        skip:
          - cargo-sources.json
          - org.cheesycrab.Calyx.yml
          - README.md
